name: Quality checks
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:release
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start local test site
        run: npm run dev -- --port 5173 > /tmp/tag-master-vite.log 2>&1 &
      - name: Wait for test site
        run: curl --retry 30 --retry-connrefused --retry-delay 1 --fail http://localhost:5173/
      - run: npm run test:ui && npm run test:api-ui && npm run test:qol-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: artifacts/
          retention-days: 7
